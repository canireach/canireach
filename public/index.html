<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>canireach</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #0e1014;
      --panel: #161a22;
      --panel-2: #1c2230;
      --border: #232a38;
      --fg: #e6eaf2;
      --fg-soft: #b8bfcd;
      --muted: #8892a6;
      --ok: #34c47a;
      --warn: #e6b04c;
      --bad: #ef5364;
      --info: #6a8cff;
      --restricted: #b485ff;
      --skipped: #444c5d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    code, .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }

    /* ---------------- header ---------------- */
    header { padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--fg-soft); }
    header .meta { font-size: 12px; color: var(--muted); }
    header .meta b { color: var(--fg-soft); font-weight: 500; }
    header .spacer { flex: 1; }
    .lang-toggle { background: transparent; border: 1px solid var(--border); color: var(--fg-soft);
      padding: 4px 12px; border-radius: 999px; font-size: 11px; cursor: pointer; font-family: inherit;
      letter-spacing: 0.05em; }
    .lang-toggle:hover { color: var(--fg); border-color: var(--muted); }

    main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; display: flex; flex-direction: column; gap: 20px; }

    /* ---------------- top banners ---------------- */
    .banners { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .banner { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel); display: flex; align-items: center; gap: 12px; }
    .banner .icon { width: 32px; height: 32px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
    .banner.ok       .icon { background: rgba(52,196,122,0.18); color: var(--ok); }
    .banner.warn     .icon { background: rgba(230,176,76,0.18); color: var(--warn); }
    .banner.bad      .icon { background: rgba(239,83,100,0.18); color: var(--bad); }
    .banner.restricted      .icon { background: rgba(180,133,255,0.18); color: var(--restricted); }
    .banner.unknown  .icon { background: rgba(136,146,166,0.18); color: var(--muted); }
    .banner.ok       { border-color: rgba(52,196,122,0.35); }
    .banner.warn     { border-color: rgba(230,176,76,0.4); }
    .banner.bad      { border-color: rgba(239,83,100,0.45); }
    .banner.restricted      { border-color: rgba(180,133,255,0.4); }
    .banner .text    { flex: 1; min-width: 0; }
    .banner .text .heading { display: flex; align-items: baseline; gap: 10px; }
    .banner .text .label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; flex: none; }
    .banner .text .title { font-size: 15px; font-weight: 600; line-height: 1.2; }
    .banner .text .sub { margin-top: 3px; font-size: 12px; color: var(--fg-soft);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------------- layer cards ---------------- */
    .layers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .layer-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; position: relative; transition: border-color 0.2s; }
    .layer-card .top-line { display: flex; align-items: center; gap: 6px; }
    .layer-card .top-line .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .layer-card .layer-name { font-size: 12px; color: var(--fg-soft); font-weight: 600; }
    .layer-card .layer-name .en { color: var(--muted); opacity: 0.55; font-weight: 400; font-size: 10px; margin-left: 2px; }
    .layer-card .status-word { margin-top: 6px; font-size: 13px; font-weight: 500; }
    .layer-card .status-word.ok      { color: var(--ok); }
    .layer-card .status-word.warn    { color: var(--warn); }
    .layer-card .status-word.bad     { color: var(--bad); }
    .layer-card .status-word.restricted     { color: var(--restricted); }
    .layer-card .status-word.skipped { color: var(--muted); }
    .layer-card .status-word.unknown { color: var(--muted); }
    .layer-card .metric { margin-top: 4px; font-size: 11px; color: var(--muted); line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-card .metric .mono { color: var(--fg-soft); }
    .layer-card.ok       { border-color: rgba(52,196,122,0.32); }
    .layer-card.warn     { border-color: rgba(230,176,76,0.45); }
    .layer-card.bad      { border-color: rgba(239,83,100,0.5); }
    .layer-card.restricted      { border-color: rgba(180,133,255,0.32); }
    .layer-card.skipped  { opacity: 0.5; }
    .dot.ok      { background: var(--ok); }
    .dot.warn    { background: var(--warn); }
    .dot.bad     { background: var(--bad); }
    .dot.restricted     { background: var(--restricted); }
    .dot.skipped { background: var(--skipped); }
    .dot.unknown { background: var(--muted); opacity: 0.5; }

    /* ---------------- section labels ---------------- */
    .section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .section-title h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg-soft); }
    .section-title .hint { font-size: 12px; color: var(--muted); }

    /* ---------------- timeline ---------------- */
    .timeline { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .heatmap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .heatmap-row .label { width: 110px; flex: none; font-size: 12px; color: var(--fg-soft); }
    .heatmap-row .label .en { display: block; color: var(--muted); opacity: 0.7; font-size: 10px; }
    .heatmap-row .cells { display: grid; grid-auto-flow: column; grid-auto-columns: 6px; gap: 1px; flex: 1; }
    .cells .cell { height: 18px; border-radius: 2px; }
    .cell.ok        { background: var(--ok); }
    .cell.warn      { background: var(--warn); }
    .cell.bad       { background: var(--bad); }
    .cell.restricted       { background: var(--restricted); }
    .cell.skipped   { background: var(--skipped); opacity: 0.6; }
    .cell.unknown   { background: var(--muted); opacity: 0.25; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

    /* ---------------- tabs ---------------- */
    .trends { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tabs button { background: none; border: none; color: var(--muted); padding: 12px 18px;
      font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
      font-family: inherit; }
    .tabs button:hover { color: var(--fg-soft); }
    .tabs button.active { color: var(--fg); border-bottom-color: var(--info); }
    .tab-body { padding: 14px 16px; }
    .tab-body .help { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    .chart-wrap { position: relative; height: 260px; }
    canvas { width: 100% !important; height: 100% !important; }
    .chart-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) {
      .layers { grid-template-columns: repeat(3, 1fr); }
      .banners { grid-template-columns: 1fr; }
      .chart-grid-2 { grid-template-columns: 1fr; }
    }

    /* ---------------- collapsibles ---------------- */
    details { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
    details > summary { padding: 12px 16px; cursor: pointer; font-size: 13px; color: var(--fg-soft); list-style: none;
      display: flex; align-items: center; gap: 8px; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸"; color: var(--muted); transition: transform 0.15s; }
    details[open] > summary::before { transform: rotate(90deg); }
    details > .body { padding: 0 16px 16px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 11px;
      background: var(--panel-2); padding: 10px; border-radius: 6px; max-height: 360px; overflow: auto; color: var(--fg-soft); }

    /* tables inside detail panes */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table th, table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    table th { color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <h1>canireach</h1>
    <span class="meta" data-i18n-static="metaPrefix"></span><span class="meta"> · <b id="updated">…</b> · <span class="meta" id="cycle"></span></span>
    <span class="spacer"></span>
    <button class="lang-toggle" id="lang-toggle" aria-label="toggle language">EN</button>
  </header>

  <main>
    <!-- 1) two side-by-side verdict banners -->
    <section class="banners">
      <div class="banner unknown" id="banner-net">
        <div class="icon" id="banner-net-icon">·</div>
        <div class="text">
          <div class="heading">
            <span class="label" data-i18n-static="bannerNetLabel"></span>
            <span class="title" id="banner-net-title">…</span>
          </div>
          <div class="sub" id="banner-net-sub"></div>
        </div>
      </div>
      <div class="banner unknown" id="banner-ai">
        <div class="icon" id="banner-ai-icon">·</div>
        <div class="text">
          <div class="heading">
            <span class="label" data-i18n-static="bannerAiLabel"></span>
            <span class="title" id="banner-ai-title">…</span>
          </div>
          <div class="sub" id="banner-ai-sub"></div>
        </div>
      </div>
    </section>

    <!-- 2) six layer cards -->
    <section>
      <div class="layers" id="layer-cards"></div>
    </section>

    <!-- 3) verdict timeline -->
    <section>
      <div class="section-title">
        <h2 data-i18n-static="timelineTitle"></h2>
        <span class="hint" data-i18n-static="timelineHint"></span>
      </div>
      <div class="timeline" style="margin-top: 10px">
        <div id="heatmap"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <!-- 4) trends with tabs -->
    <section>
      <div class="section-title">
        <h2 data-i18n-static="trendsTitle"></h2>
        <span class="hint" data-i18n-static="trendsHint"></span>
      </div>
      <div class="trends" style="margin-top: 10px">
        <div class="tabs" id="tabs">
          <button data-tab="ping" class="active" data-i18n-static="tabPing"></button>
          <button data-tab="https" data-i18n-static="tabHttps"></button>
          <button data-tab="ai" data-i18n-static="tabAi"></button>
          <button data-tab="wifi" data-i18n-static="tabWifi"></button>
          <button data-tab="proxy" data-i18n-static="tabProxy"></button>
          <button data-tab="dns" data-i18n-static="tabDns"></button>
        </div>
        <div class="tab-body">
          <div data-tab-pane="ping">
            <p class="help" data-i18n-html="helpPing"></p>
            <div class="chart-wrap"><canvas id="chart-ping"></canvas></div>
          </div>
          <div data-tab-pane="https" hidden>
            <p class="help" data-i18n-html="helpHttps"></p>
            <div class="chart-wrap"><canvas id="chart-https"></canvas></div>
            <table style="margin-top: 14px">
              <thead><tr>
                <th data-i18n-static="thTarget"></th>
                <th data-i18n-static="thVia"></th>
                <th data-i18n-static="thRate"></th>
                <th data-i18n-static="thAvgMs"></th>
              </tr></thead>
              <tbody id="https-table"></tbody>
            </table>
          </div>
          <div data-tab-pane="ai" hidden>
            <p class="help" data-i18n-html="helpAi"></p>
            <table style="margin-bottom: 14px">
              <thead><tr>
                <th data-i18n-static="thEndpoint"></th>
                <th data-i18n-static="thVia"></th>
                <th data-i18n-static="thRate"></th>
                <th data-i18n-static="thAvgMsOk"></th>
              </tr></thead>
              <tbody id="ai-table"></tbody>
            </table>
            <div class="chart-wrap"><canvas id="chart-ai"></canvas></div>
          </div>
          <div data-tab-pane="wifi" hidden>
            <p class="help" data-i18n-html="helpWifi"></p>
            <div class="chart-wrap"><canvas id="chart-wifi"></canvas></div>
          </div>
          <div data-tab-pane="proxy" hidden>
            <p class="help" data-i18n-html="helpProxy"></p>
            <div class="chart-grid-2">
              <div>
                <div class="help" style="margin-bottom:4px;font-weight:500;color:var(--fg-soft)" data-i18n-static="proxyMsTitle"></div>
                <div class="chart-wrap" style="height: 220px"><canvas id="chart-proxy-ms"></canvas></div>
              </div>
              <div>
                <div class="help" style="margin-bottom:4px;font-weight:500;color:var(--fg-soft)" data-i18n-static="proxyMbpsTitle"></div>
                <div class="chart-wrap" style="height: 220px"><canvas id="chart-proxy-mbps"></canvas></div>
              </div>
            </div>
            <div id="egress-list" class="help" style="margin-top: 12px"></div>
          </div>
          <div data-tab-pane="dns" hidden>
            <p class="help" data-i18n-html="helpDns"></p>
            <div class="chart-wrap"><canvas id="chart-dns"></canvas></div>
          </div>
        </div>
      </div>
    </section>

    <details>
      <summary data-i18n-static="conclusionsTitle"></summary>
      <div class="body"><pre id="conclusions">…</pre></div>
    </details>
    <details>
      <summary data-i18n-static="rawTitle"></summary>
      <div class="body"><pre id="latest-raw">…</pre></div>
    </details>
  </main>

  <script src="/chart.js"></script>
  <script>
    /* =================================================================
       I18N

         - data-i18n-static="key"  → element.textContent = T[key]
         - data-i18n-html="key"    → element.innerHTML = T[key]  (when markup needed)
         - t("key", params)        → from JS code, with {placeholder} substitution
       Lang toggles between "zh" and "en", persisted in localStorage("canireach.lang"),
       defaults to navigator.language. No reload needed — full re-render on toggle.
    */

    let lang = (() => {
      const saved = localStorage.getItem("canireach.lang");
      if (saved === "zh" || saved === "en") return saved;
      return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
    })();

    function t(key, params) {
      let s = I18N[lang][key];
      if (s === undefined) s = I18N.en[key] ?? key;
      if (params) for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, String(v));
      return s;
    }

    function applyStaticI18n() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      for (const el of document.querySelectorAll("[data-i18n-static]")) {
        el.textContent = t(el.dataset.i18nStatic);
      }
      for (const el of document.querySelectorAll("[data-i18n-html]")) {
        el.innerHTML = t(el.dataset.i18nHtml);
      }
      document.getElementById("lang-toggle").textContent = t("toggleLabel");
    }

    // -------------------- helpers --------------------
    const $ = (s) => document.querySelector(s);
    const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString(lang === "zh" ? "zh-CN" : "en-GB", { hour12: false }); } catch { return iso; } };
    async function fetchJson(p) { const r = await fetch(p); return r.ok ? r.json() : null; }
    async function fetchText(p) { const r = await fetch(p); return r.ok ? r.text() : null; }

    const stateBucket = (st) => st === "ok" ? "ok" : st === "degraded" ? "warn" : st === "fail" ? "bad" : st === "skipped" ? "skipped" : "unknown";

    // -------------------- banner content --------------------
    function netBanner(overall) {
      const icon = { healthy: "✓", direct_blocked_proxy_ok: "◇", degraded: "!", proxy_bad: "✕",
                     broadband_bad: "✕", wifi_bad: "✕", lan_bad: "✕", unknown: "·" }[overall] ?? "·";
      const mood = overall === "healthy" ? "ok"
                 : overall === "direct_blocked_proxy_ok" ? "restricted"
                 : overall === "degraded" ? "warn"
                 : overall === "unknown" ? "unknown"
                 : "bad";
      return { mood, icon, title: t(`netTitle_${overall}`), sub: t(`netSub_${overall}`) };
    }

    function aiBannerFromState(aiV, latest) {
      const state = aiV.state ?? "unknown";
      const icon = { ok: "✓", proxy_only: "✓", degraded: "!", direct_only: "!",
                     fail: "✕", skipped: "·", unknown: "·" }[state] ?? "·";
      const mood = (state === "ok" || state === "proxy_only") ? "ok"
                 : (state === "degraded" || state === "direct_only") ? "warn"
                 : state === "fail" ? "bad"
                 : "unknown";
      let sub;
      if (state === "ok") {
        const directHits = ["anthropic_direct","openai_direct"]
          .filter((l) => latest.https?.find((h) => h.label === l)?.ok).length;
        sub = t("aiSub_ok", { n: directHits });
      } else if (state === "degraded") {
        const aP = latest.https?.find((h) => h.label === "anthropic_proxy")?.ok;
        const ok = aP ? "Anthropic" : "OpenAI";
        const fail = aP ? "OpenAI" : "Anthropic";
        sub = t("aiSub_degraded", { ok, fail });
      } else {
        sub = t(`aiSub_${state}`);
      }
      return { mood, icon, title: t(`aiTitle_${state}`), sub };
    }

    function renderBanners(latest) {
      const v = netBanner(latest.verdict.overall);
      $("#banner-net").className = "banner " + v.mood;
      $("#banner-net-icon").textContent = v.icon;
      $("#banner-net-title").textContent = v.title;
      $("#banner-net-sub").textContent = v.sub;
      $("#banner-net-sub").title = v.sub;

      const a = aiBannerFromState(latest.verdict.ai ?? { state: "unknown" }, latest);
      $("#banner-ai").className = "banner " + a.mood;
      $("#banner-ai-icon").textContent = a.icon;
      $("#banner-ai-title").textContent = a.title;
      $("#banner-ai-sub").textContent = a.sub;
      $("#banner-ai-sub").title = a.sub;
    }

    // -------------------- layer cards --------------------
    const LAYER_KEYS = ["wifi", "lan", "broadband", "overseas_direct", "proxy", "ai"];
    function layerMetric(key, s) {
      switch (key) {
        case "wifi":
          return s.wifi ? `<span class="mono">${s.wifi.rssi ?? "?"}dBm</span> · ${s.wifi.txRate ?? "?"}Mbps` : "—";
        case "lan": {
          const gw = s.iface?.gateway, p = s.pings?.find((x) => x.target === gw);
          if (!gw) return "—";
          const short = gw.split(".").slice(-2).join(".");
          return `<span class="mono">${short}</span> · ${p?.ok ? Math.round(p.avgMs) + " ms" : t("metric_loss")}`;
        }
        case "broadband": {
          const b = s.https?.find((h) => h.label === "baidu_direct");
          if (!b) return "—";
          return `${t("metric_baidu")} <span class="mono">${b.ok ? Math.round(b.totalMs) + " ms" : t("metric_fail")}</span>`;
        }
        case "overseas_direct": {
          const dirs = (s.https ?? []).filter((h) =>
            h.via === "direct" && !["baidu_direct","taobao_direct","anthropic_direct","openai_direct"].includes(h.label));
          const ok = dirs.filter((h) => h.ok).length;
          return t("metric_reachable", { n: ok, total: dirs.length });
        }
        case "proxy": {
          const eg = s.proxyEgress?.ip;
          if (eg) return `${t("metric_egress")} <span class="mono">${eg}</span>`;
          return s.proxyConfig?.listening ? t("metric_listening") : t("metric_notListening");
        }
        case "ai": {
          const aP = s.https?.find((h) => h.label === "anthropic_proxy")?.ok;
          const oP = s.https?.find((h) => h.label === "openai_proxy")?.ok;
          return `proxy: A=${aP ? "✓" : "✕"} O=${oP ? "✓" : "✕"}`;
        }
      }
      return "—";
    }

    function bucketForOverseas(latest, layerSt) {
      if (layerSt === "fail" && latest.verdict?.layers?.find((l) => l.layer === "proxy")?.state === "ok") return "restricted";
      return stateBucket(layerSt);
    }

    function renderLayers(latest) {
      const c = $("#layer-cards");
      c.innerHTML = "";
      for (const key of LAYER_KEYS) {
        const layer = latest.verdict.layers.find((l) => l.layer === key);
        const st = layer?.state ?? "unknown";
        const bucket = key === "overseas_direct" ? bucketForOverseas(latest, st) : stateBucket(st);
        const sub = t(`layerSub_${key}`);
        const div = document.createElement("div");
        div.className = "layer-card " + bucket;
        div.innerHTML = `
          <div class="top-line">
            <span class="dot ${bucket}"></span>
            <span class="layer-name">${t(`layerName_${key}`)}${sub ? `<span class="en">${sub}</span>` : ""}</span>
          </div>
          <div class="status-word ${bucket}">${t(`sw_${bucket}`)}</div>
          <div class="metric">${layerMetric(key, latest)}</div>
        `;
        c.appendChild(div);
      }
    }

    // -------------------- legend --------------------
    function renderLegend() {
      const items = [
        ["ok", "var(--ok)"],
        ["restricted", "var(--restricted)"],
        ["warn", "var(--warn)"],
        ["bad", "var(--bad)"],
        ["skipped", "var(--skipped);opacity:0.6"],
        ["unknown", "var(--muted);opacity:0.25"],
      ];
      $("#legend").innerHTML = items.map(([k, c]) =>
        `<span><span class="swatch" style="background:${c}"></span>${t(`legend_${k}`)}</span>`).join("");
    }

    // -------------------- heatmap --------------------
    function renderHeatmap(series) {
      const root = $("#heatmap");
      root.innerHTML = "";
      const rows = ["overall", "ai", "wifi", "lan", "broadband", "overseas_direct", "proxy"];
      for (const key of rows) {
        const row = document.createElement("div");
        row.className = "heatmap-row";
        const sub = t(`timelineRowSub_${key}`);
        row.innerHTML = `<span class="label">${t(`timelineRow_${key}`)}${sub ? `<span class="en">${sub}</span>` : ""}</span><div class="cells"></div>`;
        const cells = row.querySelector(".cells");
        const arr = key === "overall" ? series.verdict : series.layers[key];
        for (let i = 0; i < arr.length; i++) {
          let cls;
          if (key === "overall") {
            const v = arr[i];
            cls = v === "healthy" ? "ok"
                : v === "direct_blocked_proxy_ok" ? "restricted"
                : v === "degraded" ? "warn"
                : v === "unknown" ? "unknown" : "bad";
          } else if (key === "overseas_direct") {
            const st = arr[i], proxySt = series.layers.proxy[i];
            cls = (st === "fail" && proxySt === "ok") ? "restricted" : stateBucket(st);
          } else {
            cls = stateBucket(arr[i]);
          }
          const cell = document.createElement("div");
          cell.className = "cell " + cls;
          cell.title = `${fmtTime(series.t[i])}  ${t(`timelineRow_${key}`)}: ${arr[i]}`;
          cells.appendChild(cell);
        }
        root.appendChild(row);
      }
    }

    // -------------------- tabs --------------------
    let activeTab = "ping";
    document.querySelectorAll("#tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll("[data-tab-pane]").forEach((p) => p.hidden = p.dataset.tabPane !== activeTab);
        for (const id of Object.keys(charts)) charts[id]?.resize();
      });
    });

    // -------------------- charts --------------------
    const charts = {};
    let lastSeries = null;   // re-used on language toggle
    let lastState = null;

    function makeOrUpdateLine(id, labels, datasets, opts = {}) {
      const cfg = {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          scales: Object.assign({
            x: { ticks: { color: "#8892a6", maxTicksLimit: 8, font: { size: 10 } }, grid: { color: "#1f2535" } },
            y: { ticks: { color: "#8892a6", font: { size: 10 } }, grid: { color: "#1f2535" }, beginAtZero: opts.beginAtZero ?? true },
          }, opts.scales || {}),
          plugins: {
            legend: { labels: { color: "#b8bfcd", font: { size: 11 }, boxWidth: 14, boxHeight: 8 } },
            tooltip: { backgroundColor: "#1c2230", titleColor: "#e6eaf2", bodyColor: "#b8bfcd", borderColor: "#232a38", borderWidth: 1 },
          },
        },
      };
      if (charts[id]) {
        charts[id].data = cfg.data;
        charts[id].options = cfg.options;
        charts[id].update();
      } else {
        charts[id] = new Chart(document.getElementById(id), cfg);
      }
    }

    const PAL = ["#34c47a", "#6a8cff", "#e6b04c", "#ef5364", "#b485ff", "#5ed3f3", "#ff8b3d", "#a6e22e", "#e6eaf2"];
    const dsLine = (label, data, color, opts = {}) => ({
      label, data, borderColor: color, backgroundColor: color, tension: 0.25, spanGaps: true,
      borderWidth: 1.4, pointRadius: 0, pointHoverRadius: 4, ...opts,
    });
    const dsLineGap = (label, data, color, opts = {}) => ({
      label, data, borderColor: color, backgroundColor: color, tension: 0,
      spanGaps: false, borderWidth: 1.3, pointRadius: 1.5, pointHoverRadius: 4, ...opts,
    });

    function renderCharts(series) {
      const labels = series.t.map(fmtTime);
      makeOrUpdateLine("chart-ping", labels, [
        dsLine(t("chart_gateway"), series.pings.gw, "#6a8cff"),
        dsLine(t("chart_aliDns"), series.pings.ali, "#34c47a"),
        dsLine("1.1.1.1", series.pings.cf, "#e6b04c"),
        dsLine("8.8.8.8", series.pings.goo, "#ef5364"),
      ]);
      const httpsDs = [];
      let i = 0;
      const nonAi = Object.keys(series.https).filter((k) => !k.startsWith("anthropic_") && !k.startsWith("openai_"));
      for (const lbl of nonAi) httpsDs.push(dsLineGap(lbl, series.https[lbl].totalMs, PAL[i++ % PAL.length]));
      makeOrUpdateLine("chart-https", labels, httpsDs);

      const aiLabels = ["anthropic_direct", "anthropic_proxy", "openai_direct", "openai_proxy"];
      const aiCols = { anthropic_direct: "#b485ff", anthropic_proxy: "#34c47a", openai_direct: "#ef5364", openai_proxy: "#6a8cff" };
      const aiDs = [];
      for (const lbl of aiLabels) if (series.https[lbl]) aiDs.push(dsLineGap(lbl, series.https[lbl].totalMs, aiCols[lbl]));
      makeOrUpdateLine("chart-ai", labels, aiDs);

      makeOrUpdateLine("chart-wifi", labels, [
        dsLine(t("chart_rssi"), series.wifi.rssi, "#6a8cff", { yAxisID: "y" }),
        dsLine(t("chart_txRate"), series.wifi.txRate, "#e6b04c", { yAxisID: "y1" }),
      ], {
        scales: {
          x: { ticks: { color: "#8892a6", maxTicksLimit: 8, font: { size: 10 } }, grid: { color: "#1f2535" } },
          y:  { position: "left", ticks: { color: "#6a8cff" }, grid: { color: "#1f2535" }, suggestedMax: -20, suggestedMin: -90, title: { display: true, text: "dBm", color: "#6a8cff" } },
          y1: { position: "right", ticks: { color: "#e6b04c" }, grid: { display: false }, beginAtZero: true, title: { display: true, text: "Mbps", color: "#e6b04c" } },
        },
      });
      makeOrUpdateLine("chart-proxy-ms", labels, [
        dsLine(t("chart_egressMs"), series.proxy.egressMs, "#6a8cff"),
      ]);
      makeOrUpdateLine("chart-proxy-mbps", labels, [
        { label: t("chart_downloadMbps"), data: series.proxy.downloadMbps, borderColor: "#34c47a", backgroundColor: "#34c47a",
          tension: 0, spanGaps: true, borderWidth: 1.4, pointRadius: 3, pointHoverRadius: 5 },
      ]);
      const dnsDs = [];
      const dnsCols = { system: "#e6eaf2", "223.5.5.5": "#34c47a", "119.29.29.29": "#e6b04c", "8.8.8.8": "#ef5364", "1.1.1.1": "#b485ff" };
      for (const [server, arr] of Object.entries(series.dns)) {
        dnsDs.push(dsLine(server, arr, dnsCols[server] || "#888"));
      }
      makeOrUpdateLine("chart-dns", labels, dnsDs);

      const counts = {};
      for (const ip of series.proxy.egressIp) if (ip) counts[ip] = (counts[ip] || 0) + 1;
      const list = Object.entries(counts).sort((a, b) => b[1] - a[1])
        .map(([ip, n]) => `<code class="mono">${ip}</code> ×${n}`).join(" · ");
      $("#egress-list").innerHTML = t("egressListPrefix") + (list || t("egressListNone"));
    }

    function renderHttpsTables(state) {
      const agg = state?.rolling?.httpsAgg || {};
      const sorted = Object.entries(agg).sort((a, b) => (a[0] < b[0] ? -1 : 1));
      const makeRow = (label, info) => {
        const via = label.endsWith("_proxy") ? "proxy" : "direct";
        const rate = info.total ? `${info.ok}/${info.total}` : "—";
        const okPct = info.total ? info.ok / info.total : 0;
        const cls = okPct === 1 ? "ok" : okPct > 0 ? "warn" : "bad";
        return `<tr><td>${label}</td><td>${via}</td>
          <td><span class="dot ${cls}" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>${rate}</td>
          <td>${info.avgMs ? Math.round(info.avgMs) + ' ms' : "—"}</td></tr>`;
      };
      $("#https-table").innerHTML = sorted
        .filter(([k]) => !k.startsWith("anthropic_") && !k.startsWith("openai_"))
        .map(([k, v]) => makeRow(k, v)).join("");
      $("#ai-table").innerHTML = sorted
        .filter(([k]) => k.startsWith("anthropic_") || k.startsWith("openai_"))
        .map(([k, v]) => makeRow(k, v)).join("");
    }

    // -------------------- refresh --------------------
    function renderAll() {
      applyStaticI18n();
      renderLegend();
      if (!lastState) {
        $("#updated").textContent = t("noDataYet");
        $("#banner-net-title").textContent = t("bannerLoadingTitle");
        $("#banner-net-sub").textContent = t("bannerLoadingSub");
        $("#banner-ai-title").textContent = t("bannerLoadingTitle");
        $("#banner-ai-sub").textContent = t("bannerAiInitialSub");
        return;
      }
      $("#updated").textContent = new Date(lastState.updatedAt).toLocaleString(lang === "zh" ? "zh-CN" : "en-GB", { hour12: false });
      $("#cycle").textContent = t("cycleLabel", { n: lastState.cycle, sec: Math.round(lastState.interval_ms/1000) });
      renderBanners(lastState.latest);
      renderLayers(lastState.latest);
      if (lastSeries && lastSeries.t.length) {
        renderHeatmap(lastSeries);
        renderCharts(lastSeries);
      }
      renderHttpsTables(lastState);
      $("#conclusions").textContent = lastConclusions ?? t("conclusionsEmpty");
      $("#latest-raw").textContent = JSON.stringify(lastState.latest, null, 2);
    }

    let lastConclusions = null;
    async function refresh() {
      lastState = await fetchJson("/api/state");
      lastSeries = await fetchJson("/api/series?limit=240");
      lastConclusions = await fetchText("/api/conclusions");
      renderAll();
    }

    // -------------------- lang toggle --------------------
    document.getElementById("lang-toggle").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("canireach.lang", lang);
      renderAll();
    });

    // initial paint with static strings before data arrives, then fetch
    applyStaticI18n();
    renderLegend();
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
